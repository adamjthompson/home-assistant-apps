name: "Ooma Call Logs"
description: "Logs into Ooma via your own FlareSolverr instance, reads your recent call log, and updates a Home Assistant sensor directly."
version: "0.2.0"
slug: "ooma_call_logs"
init: false
arch:
  - aarch64
  - amd64
startup: "services"
boot: "auto"
homeassistant_api: true
options:
  ooma_username: ""
  ooma_password: ""
  flaresolverr_url: ""
  run_interval_minutes: 15
schema:
  ooma_username: str
  ooma_password: password
  flaresolverr_url: "url?"
  run_interval_minutes: int(1,1440)
logger: true
