configuration:
  ooma_username:
    name: Ooma Username
    description: "Your my.ooma.com account login username."
  ooma_password:
    name: Ooma Password
    description: "Your my.ooma.com account login password."
  flaresolverr_url:
    name: FlareSolverr URL
    description: "The base URL of a FlareSolverr instance you already have running (e.g. http://192.168.1.30:8191). This add-on does not bundle or run FlareSolverr itself -- point it at your own instance."
  run_interval_minutes:
    name: Run Interval (minutes)
    description: "How often to check for new call-log entries. Each run destroys and recreates a FlareSolverr browser session on your FlareSolverr instance, which has a real CPU/RAM cost -- consider a longer interval if that instance runs on constrained hardware."
