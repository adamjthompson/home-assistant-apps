configuration:
  centerpoint_username:
    name: CenterPoint Username
    description: "Your CenterPoint Energy account login username."
  centerpoint_password:
    name: CenterPoint Password
    description: "Your CenterPoint Energy account login password."
  gmail_address:
    name: Gmail Address (optional)
    description: "Optional. The Gmail address that receives CenterPoint's 2FA verification-code emails, only used if CenterPoint ever actually challenges a login with 2FA (hasn't happened in testing so far -- the add-on works fine without this set). Leave blank unless you want automatic 2FA recovery; if 2FA is challenged with this unset, the run fails with a clear error instead of crashing."
  gmail_app_password:
    name: Gmail App Password (optional)
    description: "Optional, only needed alongside gmail_address. A Gmail app password (not your regular Google password) used to read the 2FA code via IMAP when CenterPoint challenges a login. Requires 2-Step Verification enabled on the Google account to generate one. Note: this grants read access to the entire mailbox, not just CenterPoint's emails -- a dedicated Gmail account used only for utility 2FA mail is a stronger isolation option if you'd prefer not to grant access to your everyday inbox."
  cycles_back:
    name: Billing Cycles Back
    description: "How many recent meter-read cycles to import each run. The billing-history table shows at most 24, so anything higher just imports everything available."
  run_interval_hours:
    name: Run Interval (hours)
    description: "How often to check for a new billing-history row. A new reading only ever appears once per meter-read cycle (roughly every 28-33 days), so there's no benefit running this frequently -- frequent runs just risk unnecessary logins."
