configuration:
  aes_username:
    name: AES Ohio Username
    description: "Your myprofile.aes-ohio.com login username."
  aes_password:
    name: AES Ohio Password
    description: "Your myprofile.aes-ohio.com login password."
  days_back:
    name: Days Back
    description: "How many days of usage history to request on each run. A few days of overlap covers any lag before AES finalizes an hour's data."
  run_interval_hours:
    name: Run Interval (hours)
    description: "How often to log in and re-check usage. Usage data is hourly, so there's no benefit running more than a few times a day."
