# =============================================================================
# Mazda Connected Services — Home Assistant Configuration
# =============================================================================
# Add the contents of each section below to the corresponding section in your
# configuration.yaml, OR split into separate files using the !include directive.
#
# The add-on runs on port 3000. If you changed that, update the URLs below.
# Replace YOUR_VEHICLE_ID with the id returned by http://<ha-ip>:3000/vehicles
# (or omit ?id=... entirely to default to your first/only vehicle)
# =============================================================================

# -----------------------------------------------------------------------------
# REST sensors — polls /sensors every 5 minutes
# -----------------------------------------------------------------------------
rest:
  - resource: "http://localhost:3000/sensors"
    scan_interval: 300   # seconds — match your add-on poll_interval_minutes
    sensor:
      - name: "Mazda Fuel Level"
        unique_id: mazda_fuel_level
        value_template: "{{ value_json.fuel_level_percent }}"
        unit_of_measurement: "%"
        device_class: battery
        icon: mdi:gas-station

      - name: "Mazda Fuel Range"
        unique_id: mazda_fuel_range
        value_template: "{{ value_json.fuel_range_miles }}"
        unit_of_measurement: "mi"
        icon: mdi:map-marker-distance

      - name: "Mazda Odometer"
        unique_id: mazda_odometer
        value_template: "{{ value_json.odometer_miles }}"
        unit_of_measurement: "mi"
        icon: mdi:counter

      - name: "Mazda Tire FL"
        unique_id: mazda_tire_fl
        value_template: "{{ value_json.tire_fl_psi }}"
        unit_of_measurement: "psi"
        icon: mdi:tire

      - name: "Mazda Tire FR"
        unique_id: mazda_tire_fr
        value_template: "{{ value_json.tire_fr_psi }}"
        unit_of_measurement: "psi"
        icon: mdi:tire

      - name: "Mazda Tire RL"
        unique_id: mazda_tire_rl
        value_template: "{{ value_json.tire_rl_psi }}"
        unit_of_measurement: "psi"
        icon: mdi:tire

      - name: "Mazda Tire RR"
        unique_id: mazda_tire_rr
        value_template: "{{ value_json.tire_rr_psi }}"
        unit_of_measurement: "psi"
        icon: mdi:tire

      - name: "Mazda Last Updated"
        unique_id: mazda_last_updated
        value_template: "{{ value_json.last_updated }}"
        icon: mdi:clock-outline

    binary_sensor:
      - name: "Mazda Locked"
        unique_id: mazda_locked
        value_template: "{{ value_json.is_locked }}"
        device_class: lock

      - name: "Mazda Driver Door"
        unique_id: mazda_driver_door
        value_template: "{{ value_json.driver_door_open }}"
        device_class: door

      - name: "Mazda Passenger Door"
        unique_id: mazda_passenger_door
        value_template: "{{ value_json.passenger_door_open }}"
        device_class: door

      - name: "Mazda Rear Left Door"
        unique_id: mazda_rear_left_door
        value_template: "{{ value_json.rear_left_door_open }}"
        device_class: door

      - name: "Mazda Rear Right Door"
        unique_id: mazda_rear_right_door
        value_template: "{{ value_json.rear_right_door_open }}"
        device_class: door

      - name: "Mazda Trunk"
        unique_id: mazda_trunk
        value_template: "{{ value_json.trunk_open }}"
        device_class: door

      - name: "Mazda Hood"
        unique_id: mazda_hood
        value_template: "{{ value_json.hood_open }}"
        device_class: door

# -----------------------------------------------------------------------------
# Device tracker — GPS location
# -----------------------------------------------------------------------------
rest:
  - resource: "http://localhost:3000/sensors"
    scan_interval: 300
    sensor:
      - name: "Mazda Location Lat"
        unique_id: mazda_lat
        value_template: "{{ value_json.latitude }}"

      - name: "Mazda Location Lon"
        unique_id: mazda_lon
        value_template: "{{ value_json.longitude }}"

# Then in automations or via a template device tracker:
# platform: template
# You can also use the lat/lon sensors to drive a map card directly.

# -----------------------------------------------------------------------------
# REST commands — lock / unlock / force refresh
# -----------------------------------------------------------------------------
rest_command:
  mazda_lock:
    url: "http://localhost:3000/lock"
    method: POST

  mazda_unlock:
    url: "http://localhost:3000/unlock"
    method: POST

  mazda_refresh:
    url: "http://localhost:3000/refresh"
    method: GET

# -----------------------------------------------------------------------------
# Example script — lock with confirmation notification
# -----------------------------------------------------------------------------
script:
  mazda_lock_car:
    alias: "Lock Mazda"
    sequence:
      - service: rest_command.mazda_lock
      - service: notify.notify
        data:
          message: "Mazda doors locked."

  mazda_unlock_car:
    alias: "Unlock Mazda"
    sequence:
      - service: rest_command.mazda_unlock
      - service: notify.notify
        data:
          message: "Mazda doors unlocked."
